<!doctype html><html lang="en"><head><meta charset="utf-8"><title>SymbioNet</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: a working tool — sticky role bar, then one column of Canvas blocks / match cards / dashboard panels on a cool mineral ground, oxblood for the brand, tannery teal for symbiotic links */
:root{
  --bg:#F1F3EF; --surface:#FFFFFF; --surface-2:#E8ECE6; --fg:#18211D; --muted:#5A6760; --line:#D3D9D2;
  --accent:#8A2D38; --accent-soft:#F3E3E4; --link:#1E6B60; --link-soft:#DDEEEA; --on-link:#FFFFFF;
  --sev0:#E6EAE4; --sev1:#F0DBB8; --sev2:#E1A25E; --sev3:#B4452D; --on-sev3:#FFFFFF;
  --sea:#DCE7EA;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111714; --surface:#19211D; --surface-2:#222C27; --fg:#E6ECE8; --muted:#97A49D; --line:#2E3A34;
  --accent:#E07C86; --accent-soft:#3A2226; --link:#5CC2B0; --link-soft:#1B3631; --on-link:#0E1512;
  --sev0:#252F2A; --sev1:#5B4B2E; --sev2:#8F5C2C; --sev3:#B9553B; --on-sev3:#FFFFFF;
  --sea:#17262B; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#19211D; --surface-2:#222C27; --fg:#E6ECE8; --muted:#97A49D; --line:#2E3A34;
  --accent:#E07C86; --accent-soft:#3A2226; --link:#5CC2B0; --link-soft:#1B3631; --on-link:#0E1512;
  --sev0:#252F2A; --sev1:#5B4B2E; --sev2:#8F5C2C; --sev3:#B9553B; --on-sev3:#FFFFFF;
  --sea:#17262B; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.top-inner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:12px}
.logo{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.logo b{font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:-.01em}
.logo b i{font-style:normal;color:var(--accent)}
.role{display:flex;align-items:center;gap:8px}
.role select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:62vw}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid transparent;background:none;padding:7px 13px;border-radius:999px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.tab:hover{background:var(--surface-2)}
.tab[aria-current="page"]{background:var(--fg);color:var(--bg)}
.badge{font-family:var(--mono);font-size:11px;min-width:20px;padding:0 6px;border-radius:999px;background:var(--surface-2);color:var(--fg);text-align:center}
.tab[aria-current="page"] .badge{background:var(--bg);color:var(--fg)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.demo{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-block:0 10px;font-size:12.5px}
.linkbtn{background:none;border:0;padding:0;color:var(--link);cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* page head */
main{display:flex;flex-direction:column;gap:18px;padding-block:24px 64px}
.phead{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.phead h1{font-size:clamp(26px,4vw,36px);font-weight:700;letter-spacing:-.015em}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px;color:var(--muted);font-size:14px}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump a{font-family:var(--mono);font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.jump a:hover{color:var(--fg);border-color:var(--muted)}

/* blocks */
.block{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;scroll-margin-top:120px}
.bhead{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.bno{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.bhead h2{font-size:20px;font-weight:700}
.bhead p{margin:0;flex-basis:100%;color:var(--muted);font-size:14px;max-width:72ch}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.panel{background:var(--surface-2);border-radius:8px;padding:12px 14px;min-width:0}
.panel h3{font-family:var(--body);font-size:13px;font-weight:600;margin-bottom:6px}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:14px}
ul.plain li{padding-left:14px;position:relative}
ul.plain li::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}

.tbl{overflow-x:auto;min-width:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px;white-space:nowrap}
.dir{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:4px;white-space:nowrap}
.dir.out{background:var(--link-soft);color:var(--link)}
.dir.in{background:var(--surface-2);color:var(--muted)}
.seek{font-size:12px;color:var(--accent);font-weight:600;white-space:nowrap}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px;line-height:1.4}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.mech{font-family:var(--mono);font-size:11.5px;padding:2px 8px;border-radius:4px;background:var(--link-soft);color:var(--link);white-space:nowrap}
.mech.sugg{background:transparent;border:1px dashed var(--line);color:var(--muted)}

.brow{display:grid;grid-template-columns:minmax(150px,200px) auto minmax(0,1fr);gap:10px 18px;align-items:start;padding-block:12px;border-top:1px solid var(--line)}
.brow:first-of-type{border-top:0}
.brow h3{font-family:var(--body);font-size:14px;font-weight:600}
.sev{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.sev button{border:0;border-right:1px solid var(--line);background:var(--surface);padding:4px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.sev button:last-child{border-right:0}
.sev button.on.s0{background:var(--sev0);color:var(--fg)}
.sev button.on.s1{background:var(--sev1);color:var(--fg)}
.sev button.on.s2{background:var(--sev2);color:var(--fg)}
.sev button.on.s3{background:var(--sev3);color:var(--on-sev3)}

.opp{display:grid;grid-template-columns:minmax(150px,200px) minmax(0,1fr);gap:8px 18px;padding-block:12px;border-top:1px solid var(--line)}
.opp:first-of-type{border-top:0}
.opp .arrow{font-family:var(--mono);color:var(--muted);font-size:12px}

.out3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.horizon{font-family:var(--mono);font-size:12px;white-space:nowrap}

/* add-flow form */
details.add{border:1px dashed var(--line);border-radius:8px;padding:10px 14px}
details.add summary{cursor:pointer;font-weight:600;color:var(--link)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.form input,.form select{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;color:var(--fg);min-width:0;width:100%}
.form .wide{grid-column:1/-1}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--link);border-color:var(--link);color:var(--on-link)}
.btn.quiet{border-color:transparent;background:none;color:var(--muted)}

/* matches */
.privacy{display:flex;gap:12px;align-items:flex-start;background:var(--link-soft);border-radius:10px;padding:14px 16px;font-size:14px}
.privacy svg{flex:none;margin-top:2px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px 24px}
.mcard.hot{border-color:var(--accent)}
.mtop{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.mtop h3{font-size:18px;font-weight:700}
.who{font-size:14px;color:var(--muted);margin-top:2px}
.who b{color:var(--fg);font-weight:600}
.flowpair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;margin-top:10px;font-size:13.5px}
.flowpair .side{background:var(--surface-2);border-radius:7px;padding:8px 10px;min-width:0}
.flowpair .side .label{display:block;margin-bottom:2px}
.profile{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 16px;background:var(--surface-2);border-radius:8px;padding:12px 14px;font-size:14px}
.profile .label{display:block;margin-bottom:2px}
.ocols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.otype{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;display:flex;flex-direction:column;gap:4px}
@media (max-width:820px){.ocols{grid-template-columns:1fr}}
.notes{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.notes li::before{content:"› ";color:var(--accent)}
.score{display:flex;flex-direction:column;gap:6px}
.score .big{display:flex;align-items:baseline;gap:6px}
.score .big b{font-family:var(--display);font-size:34px;line-height:1}
.bar{display:grid;grid-template-columns:62px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:12px}
.bar .track{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;background:var(--link);border-radius:3px}
.mfoot{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}
.steps{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.step{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.step.done{background:var(--link-soft);color:var(--link)}
.step.now{background:var(--link);color:var(--on-link)}
.step.declined{background:var(--sev0);color:var(--muted);text-decoration:line-through}
.mact{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ask{font-size:13.5px;color:var(--accent);font-weight:600}
.empty{border:1px dashed var(--line);border-radius:10px;padding:14px 16px;font-size:14px;color:var(--muted)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi b{display:block;font-family:var(--display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.map{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.heat td.cell{text-align:center;font-family:var(--mono);font-size:13px;min-width:56px}
.c0{background:var(--sev0)}.c1{background:var(--sev1)}.c2{background:var(--sev2)}.c3{background:var(--sev3);color:var(--on-sev3)}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 120px 26px;gap:10px;align-items:center;font-size:13.5px;padding-block:3px}
.hbar .track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hbar .fill{height:100%;background:var(--accent);border-radius:4px}
.hbar .fill.t{background:var(--link)}
.pill{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.interest{background:var(--sev1);color:var(--fg)}
.pill.mutual{background:var(--link-soft);color:var(--link)}
.pill.pilot,.pill.active{background:var(--link);color:var(--on-link)}
.netact{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.netact .panel{display:flex;flex-direction:column;gap:8px}
.netact h3{font-size:15px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:20}

@media (max-width:820px){
  .grid2{grid-template-columns:1fr}
  .mcard{grid-template-columns:1fr}
  .brow{grid-template-columns:1fr}
  .opp{grid-template-columns:1fr}
  .out3{grid-template-columns:1fr}
  .flowpair{grid-template-columns:1fr}
  .flowpair .arr{transform:rotate(90deg);justify-self:center}
}
@media (prefers-reduced-motion:no-preference){
  .mcard,.block{transition:border-color .2s}
  .fill{transition:width .4s ease}
}

/* components */
.fill{display:block}
.small{font-size:13px}.mt0{margin-top:0}.mt6{margin-top:6px}.fg{color:var(--fg)}.minw0{min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.badge.hot{background:var(--accent);color:#fff}
.tab[aria-current="page"] .badge.hot{background:var(--accent);color:#fff}
.strip{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent);border-radius:9px;padding:9px 14px;font-size:14px}
.steps-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.step-item{display:grid;grid-template-columns:176px minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding-block:11px;border-top:1px solid var(--line);font-size:14.5px}
.step-item:first-child{border-top:0}
.slbl{justify-self:start;display:inline-block;max-width:100%;box-sizing:border-box;font-family:var(--mono);font-size:11px;line-height:1.35;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:normal;text-align:left}
.step-item.urgent .slbl{background:var(--accent-soft);color:var(--accent);font-weight:500}
.step-item.brand .slbl{background:var(--link-soft);color:var(--link)}
.step-item.task .slbl{background:var(--surface-2);color:var(--fg)}
.step-item.data .slbl{background:var(--sev1);color:var(--fg)}
.step-item .ctl{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.kpi.act{text-align:left;cursor:pointer;font:inherit;color:inherit;border-color:var(--accent)}
.kpi.act:hover{background:var(--accent-soft)}
.stackbar{display:flex;height:16px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.stackbar span{height:100%}
.s-real{background:var(--accent)}.s-agreed{background:var(--link)}.s-pot{background:var(--sev1)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px}
.gain{margin-top:10px;font-size:13.5px;background:var(--surface-2);border-radius:7px;padding:8px 10px}
.brandtag{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent)}
.upd{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.upd.stale{color:var(--accent)}
.iconbtn{border:1px solid transparent;background:none;color:var(--muted);border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:16px;line-height:1}
.iconbtn:hover{border-color:var(--line);color:var(--accent)}
.tag{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:4px;background:var(--surface-2);white-space:nowrap}
.seek.offer{color:var(--link)}
.dir.asset{background:var(--sev1);color:var(--fg)}
table.wide{min-width:1150px}
table.wide td.desc{min-width:170px}
.btn.small{padding:4px 10px;font-size:13px}
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.ccard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;font:inherit;color:inherit}
.ccard:hover{border-color:var(--link)}
.ccard b{font-family:var(--display);font-size:17px}
.crow{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:4px}
.back{align-self:flex-start}
.right{align-items:flex-end}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.parties{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.parties li{display:flex;flex-direction:column}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.checks li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:8px;border-top:1px solid var(--line);font-size:14px}
.checks li:first-child{border-top:0}
.cbtn{width:26px;height:26px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;color:var(--on-link)}
.cbtn.ok{background:var(--link);border-color:var(--link)}
.cbtn.issue{background:var(--sev3);border-color:var(--sev3);color:var(--on-sev3)}
.cstate{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.checks li.ok .cstate{color:var(--link)}.checks li.issue .cstate{color:var(--accent)}
.econ{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;align-items:start}
.payback{display:flex;flex-direction:column;gap:10px}
.payback .panel{display:flex;flex-direction:column;gap:2px}
.payback b{font-family:var(--display);font-size:24px}
.form.tight{margin-top:0}
.form.inline{margin-top:12px}
tr.isdone td{color:var(--muted)}tr.isdone td:nth-child(2){text-decoration:line-through}

const $=s=>document.querySelector(s);

const fmt=(n,d=0)=>Number(n).toLocaleString('en-GB',{maximumFractionDigits:d});
const today=()=>new Date().toISOString().slice(0,10);
const dfmt=iso=>iso?new Date(iso+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'–';
const days=iso=>Math.floor((Date.now()-new Date(iso+'T12:00:00'))/864e5);
const PARTIES=()=>[...S.actors,S.bactor];
const actor=id=>id==='brand'?S.bactor:S.actors.find(a=>a.id===id);
const isBrand=()=>S.role==='brand';
const dimL=k=>DIMS.find(d=>d.k===k).label;
const uid=p=>p+Date.now().toString(36)+Math.floor(Math.random()*99);
const ORCH=()=>S.brand.name;
const lc=s=>/^[A-Z]{2}/.test(s)?s:s[0].toLowerCase()+s.slice(1);
const cap=s=>s[0].toUpperCase()+s.slice(1);
const nn=v=>v!==null&&v!==undefined&&v!=='';
function hav(a,b){const R=6371,r=x=>x*Math.PI/180,dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(h)))}
const siteOf=(a,f)=>a.settings.sites.find(s=>s.id===f.site)||a.settings.sites[0];
const coordOk=s=>!!s&&nn(s.lat)&&nn(s.lon)&&s.coord!=='outdated'&&s.coord!=='missing';
function dist(sa,sb){if(!coordOk(sa)||!coordOk(sb))return {d:null,flag:'missing'};return {d:hav(sa,sb),flag:sa.coord==='illustrative'||sb.coord==='illustrative'?'illus':'entered'}}
const fmtKm=(d,flag)=>d===null||d===undefined?'distance unavailable':`${flag==='illus'?'≈':''}${d} km`;
const ownerOf=fid=>PARTIES().find(a=>a.flows.some(f=>f.id===fid));

  if(asRange){const lo=Math.pow(10,Math.floor(Math.log10(Math.max(v,1)))),a=Math.floor(v/lo)*lo;return `${fmt(a)}–${fmt(a+lo)} ${esc(unit)}`}
  return `${fmt(v)} ${esc(unit)}`}
const STALE=180;

/* ===== Matching: rule-based and explainable ===== */
const isOffer=f=>f.type!=='in'&&f.lvl>0&&f.ex>0&&f.cat!=='other';
const isNeed=f=>f.type==='in'&&f.lvl>0&&f.ex>0&&f.cat!=='other';

const pairKey=(x,y)=>[x,y].sort().join('|');
/* Company pairs with established mutual consent: both expressed interest in a match, or a collaboration exists */
function consentPairs(){const P=new Set();
  for(const [id,s] of Object.entries(S.status)){if(!(s.prov&&s.recv))continue;const [o,n]=id.split('>'),A=ownerOf(o),B=ownerOf(n);if(A&&B)P.add(pairKey(A.id,B.id))}

const eligible=(f,owner,other,P)=>f.lvl>=2||(f.lvl===1&&P.has(pairKey(owner.id,other.id)));
function indicators(o,n,A,B){const c=CATS[o.cat],r=dist(siteOf(A,o),siteOf(B,n)),d=r.d,km=fmtKm(d,r.flag),I=[];
  if(c.unit==='service')I.push(['Quantity','ok','Service; quantity not applicable.']);
  else if(o.ex>=n.ex)I.push(['Quantity','ok',`Offer covers the full requirement (${fmt(n.ex)} ${c.unit}).`]);
  else I.push(['Quantity','part',`Offer covers ${Math.round(o.ex/n.ex*100)}% of the requirement.`]);
  if(c.kind==='intangible')I.push(['Geographic proximity','ok','Not distance-dependent.']);
  else if(d===null)I.push(['Geographic proximity','ver','Distance unavailable: operating-site coordinates missing or outdated.']);
  else if(c.maxKm)I.push(d<=c.maxKm?['Geographic proximity','ok',`${km} between operating sites.`]:['Geographic proximity','ver',`${km} between operating sites; low-temperature heat is usually used within about ${c.maxKm} km.`]);
  else I.push(d<=30?['Geographic proximity','ok',`${km} between operating sites; logistics not assessed.`]:d<=60?['Geographic proximity','part',`${km} between operating sites; logistics not assessed.`]:['Geographic proximity','ver',`${km} between operating sites.`]);
  if(!o.q||!n.accept.length)I.push(['Quality / specifications','ver','Quality data incomplete.']);
  else if(n.accept.includes(o.q))I.push(o.spec&&n.spec?['Quality / specifications','ok',`Declared grade “${o.q}” is accepted; detailed specifications to be compared.`]:['Quality / specifications','ver',`Declared grade “${o.q}” is accepted; technical specifications not provided by both companies.`]);
  else I.push(['Quality / specifications','part',`Declared grade “${o.q}”; accepted grade “${n.accept.join('”, “')}”. Sorting or treatment may be required.`]);
  if(o.freq===n.freq||o.freq==='continuous'||(!SEASON(o.freq)&&!SEASON(n.freq)))I.push(['Availability','ok',`Available ${o.freq}; required ${n.freq}.`]);
  else if(!SEASON(n.freq))I.push(['Availability','part',`Available only ${o.freq}; required ${n.freq}.`]);
  else I.push(['Availability','ver',`Available ${o.freq}; required ${n.freq}. Storage or rescheduling to be assessed.`]);
  return {I,d,dFlag:r.flag,ok:I.filter(x=>x[1]==='ok').length,rank:I.reduce((t,x)=>t+(x[1]==='ok'?2:x[1]==='part'?1:0),0)}}
/* Potential matches only: pairs already turned into a collaboration are read from the collaboration record */
function allMatches(){const out=[],P=consentPairs();
  for(const A of PARTIES())for(const o of offers(A))for(const B of PARTIES()){if(B.id===A.id||!eligible(o,A,B,P))continue;
    for(const n of B.flows){if(!isNeed(n)||n.cat!==o.cat||!eligible(n,B,A,P))continue;const id=o.id+'>'+n.id;if(S.collabsData[id])continue;
      const r=indicators(o,n,A,B);if(!CATS[o.cat].kind&&r.d!==null&&r.d>Math.min(A.settings.radius,B.settings.radius))continue;
      out.push({id,o,n,A,B,...r})}}
  return out.sort((x,y)=>y.rank-x.rank)}
const sOf=m=>S.status[m.id]||(S.status[m.id]={});
const C=m=>S.collabsData[m.id];
function stage(m){const c=C(m);if(c)return c.stage;const s=S.status[m.id]||{};if(s.declined)return'declined';if(s.prov&&s.recv)return'mutual';if(s.prov||s.recv)return'interest';return'proposed'}
const isCollab=m=>!!C(m);
const isActiveC=m=>isCollab(m)&&['mutual','feas','pilot','op'].includes(C(m).stage);
const isClosedC=m=>isCollab(m)&&['completed','discontinued'].includes(C(m).stage);
const isDev=m=>isCollab(m)&&['mutual','feas','pilot'].includes(C(m).stage);
const isOp=m=>isCollab(m)&&C(m).stage==='op';
const isPotential=m=>['proposed','interest'].includes(stage(m));
const revealed=m=>{const s=S.status[m.id]||{};return !!(s.prov&&s.recv)};
const mine=(m,id)=>m.A.id===id||m.B.id===id;
const roleIn=(m,id)=>m.A.id===id?'prov':'recv';
function myFlag(m,id){const s=S.status[m.id]||{};return !!s[roleIn(m,id)]}
function awaitingMe(m,id){if(isCollab(m))return false;const s=S.status[m.id]||{};if(s.declined)return false;return m.A.id===id?(s.recv&&!s.prov):(s.prov&&!s.recv)}
const isBrandParty=m=>m.A.id==='brand'||m.B.id==='brand';
const brandSees=m=>isBrandParty(m)||!isCollab(m)||C(m).orch!=='none';
/* Collaboration records keep a copy of both resources as they were when the collaboration was opened */
function snapOf(m){const cp=(f,a)=>({...f,accept:[...(f.accept||[])],siteName:siteOf(a,f).name});return {aId:m.A.id,bId:m.B.id,o:cp(m.o,m.A),n:cp(m.n,m.B),d:m.d,dFlag:m.dFlag,at:today()}}
function ensureSnaps(){for(const [id,c] of Object.entries(S.collabsData)){if(c.snap)continue;const [oid,nid]=id.split('>'),A=ownerOf(oid),B=ownerOf(nid);if(!A||!B)continue;
  const o=A.flows.find(f=>f.id===oid),n=B.flows.find(f=>f.id===nid),r=dist(siteOf(A,o),siteOf(B,n));c.snap=snapOf({A,B,o,n,d:r.d,dFlag:r.flag});c.snap.at=c.since}}
function collabObj(id){const s=S.collabsData[id].snap;return {id,o:s.o,n:s.n,A:actor(s.aId),B:actor(s.bId),d:s.d,dFlag:s.dFlag,at:s.at,I:[],ok:0,rank:0}}
const collabMatches=()=>Object.keys(S.collabsData).filter(id=>S.collabsData[id].snap).map(collabObj);
const allItems=()=>allMatches().concat(collabMatches());
const findM=id=>allItems().find(m=>m.id===id);
const linkedCollabs=(a,f)=>collabMatches().filter(m=>(m.A.id===a.id&&m.o.id===f.id)||(m.B.id===a.id&&m.n.id===f.id));
const MATCH_FIELDS=['type','cat','ex','lvl','q','unit','site','freq'];
const resDiff=(c,s)=>MATCH_FIELDS.some(k=>String(c[k])!==String(s[k]))||String(c.accept)!==String(s.accept)||c.label!==s.label;
function resourceChanged(m){const a=m.A.flows.find(f=>f.id===m.o.id),b=m.B.flows.find(f=>f.id===m.n.id);if(!a||!b)return 'removed';return resDiff(a,m.o)||resDiff(b,m.n)?'changed':''}

/* ===== Quantities and estimates (each exchange counted once) ===== */
function exQty(m){const c=C(m),base=Math.min(m.o.ex,m.n.ex);return c&&nn(c.qty)?Math.min(c.qty,base):base}
const co2=m=>(CATS[m.o.cat].f||0)*exQty(m);
function bucket(m){if(isOp(m))return'op';if(isDev(m))return'dev';if(isPotential(m)&&m.ok>=2)return'pot';return null}
function impactSum(id){const r={op:0,dev:0,pot:0};
  for(const m of allItems()){if(id?!mine(m,id):!brandSees(m))continue;const b=bucket(m);if(b)r[b]+=co2(m)}return r}

/* ===== Next steps (company) ===== */
function nextSteps(a){const out=[],ms=allMatches().filter(m=>mine(m,a.id));
  for(const m of ms){const other=m.A.id===a.id?m.B:m.A,s=S.status[m.id]||{},cat=lc(CATS[m.o.cat].label);
    if(awaitingMe(m,a.id))out.push({lvl:'urgent',t:`A ${other.sector} has expressed interest in a match for ${cat}.`,go:'matches',btn:'Respond'});
    if(stage(m)==='mutual'&&!isCollab(m))out.push({lvl:'urgent',t:`Mutual interest with ${other.short} for ${cat}; a collaboration can be opened.`,go:'matches',btn:'View match'});
    if(s.broker&&!myFlag(m,a.id)&&!s.declined&&!isCollab(m))out.push({lvl:'brand',t:`Introduction by ${ORCH()}: ${cat} with a ${other.sector}. “${s.broker.note}”`,go:'matches',btn:'View match'})}
  for(const i of S.initiatives)if(i.status==='ongoing'&&i.invited.includes(a.id)&&!i.joined.includes(a.id)&&!i.declined.includes(a.id))out.push({lvl:'brand',t:`Invitation to the initiative “${i.name}”.`,inv:i.id});
  for(const m of collabMatches()){if(!mine(m,a.id)||!isActiveC(m))continue;const c=C(m),me=m.A.id===a.id?'A':'B';
    for(const k of c.tasks)if(!k.done&&k.o===me)out.push({lvl:k.due&&k.due<today()?'urgent':'task',t:`${k.t} · ${CATS[m.o.cat].label} collaboration${k.due?` · due ${dfmt(k.due)}`:''}`,go:'collab',open:m.id,btn:'Open'})}
  for(const n of (S.nudges[a.id]||[]))out.push({lvl:'brand',t:`${ORCH()}: ${n.text}`,nudge:n.ts,go:'canvas',btn:'Review Canvas'});
  const st=Object.keys(BLOCKS).filter(b=>days(a.updated[b])>STALE);
  if(st.length)out.push({lvl:'data',t:`${st.length} Canvas block${st.length>1?'s':''} not reviewed for more than six months.`,go:'canvas',btn:'Review'});
  if(!a.settings.pec)out.push({lvl:'data',t:'PEC address missing; required for formal agreements.',go:'settings',btn:'Add'});
  const order={urgent:0,brand:1,task:2,data:3};return out.sort((x,y)=>order[x.lvl]-order[y.lvl])}

/* ===== Facilitation queue (orchestrator) ===== */
function queue(){const ms=allMatches(),q={intro:[],stalled:[],refresh:[],support:[],open:[],hidden:0};
  for(const m of ms){if(isBrandParty(m))continue;const s=S.status[m.id]||{},g=stage(m);
    if(g==='proposed'&&!s.broker&&m.ok>=3)q.intro.push(m);
    if(g==='interest'&&s.ts&&days(s.ts)>7)q.stalled.push(m)}
  for(const a of S.actors){const st=Object.keys(BLOCKS).filter(b=>days(a.updated[b])>STALE);if(st.length&&!(S.nudges[a.id]||[]).length)q.refresh.push([a,st.length])}
  for(const m of collabMatches()){if(!isActiveC(m)||C(m).orch!=='active')continue;const c=C(m),openReg=c.reg.filter(x=>x.s==='open').length,issues=[...c.tech,...c.reg].filter(x=>x.s==='issue').length,late=c.tasks.filter(t=>!t.done&&t.due&&t.due<today()).length;
    if(openReg||issues||late)q.support.push({m,openReg,issues,late})}
  const all=allItems();for(const a of S.actors)for(const f of offers(a))if(!all.some(m=>m.o.id===f.id)){if(f.lvl===3)q.open.push([a,f]);else q.hidden++}
  return q}
const qCount=q=>q.intro.length+q.stalled.length+q.refresh.length+q.support.length+q.open.filter(([a,f])=>!S.scout[f.id]).length;

const munit=u=>u.replace('/yr','').replace('/month','');
/* Actual values: only measurements recorded with value, period and source; never annualised */
function measText(list){const ok=[];let inc=0;for(const m of list){const x=C(m).measured;if(!x||!nn(x.v))continue;if(x.period&&x.source)ok.push(`${fmt(x.v)} ${munit(m.o.unit)} over ${x.period} (source: ${x.source})`);else inc++}
  if(ok.length)return ok.join('; ')+(inc?`; ${inc} incomplete measurement record${inc>1?'s':''}`:'');if(inc)return 'Measurement record incomplete (period or source missing)';return null}
function metrics(id){const ms=collabMatches().filter(m=>id?mine(m,id):brandSees(m));
  const dev=ms.filter(isDev),op=ms.filter(isOp),meas=ms.filter(m=>['op','completed'].includes(C(m).stage));
  const sum=(list,fn)=>{let t=0,any=false;for(const m of list){const v=fn(m);if(nn(v)){t+=v;any=true}}return any?t:null};
  const q=cond=>m=>cond(m)?exQty(m):null;
  const isMat=m=>CATS[m.o.cat].mat&&m.o.unit==='t/yr',isWaste=m=>CATS[m.o.cat].waste&&m.o.unit==='t/yr'&&(!id||m.A.id===id),isW=m=>m.o.cat==='water',isE=m=>CATS[m.o.cat].energy;
  const ec=(m,f)=>{const e=C(m).econ;return nn(e[f])?+e[f]:null};
  const asRecv=m=>!id||m.B.id===id,asProv=m=>!id||m.A.id===id;
  const row=(label,unit,fn,cond)=>({label,unit,dev:sum(dev,fn),op:sum(op,fn),act:cond?measText(meas.filter(cond)):null});
  return {ms,
    env:[row('Estimated avoided emissions','t CO₂e/year',m=>co2(m)||null,null),row('Material recovered or kept in use','t/year',q(isMat),isMat),row('Waste avoided','t/year',q(isWaste),isWaste),row('Water reused','m³/year',q(isW),isW),row('Energy recovered or reused','MWh/year',q(isE),isE)],
    econ:[row('Procurement cost savings','€/year',m=>asRecv(m)&&m.o.cat!=='logistics'?ec(m,'rs'):null),row('Waste disposal savings and secondary-resource revenue','€/year',m=>asProv(m)?ec(m,'ps'):null),row('Logistics cost savings','€/year',m=>asRecv(m)&&m.o.cat==='logistics'?ec(m,'rs'):null),row('Shared investments and orchestrator co-funding','€',m=>C(m).orch==='active'?ec(m,'co'):null)]}}
const val=v=>nn(v)?fmt(v,v<10&&v%1?1:0):'–';
function metricTable(rows){return `<div class="tbl"><table class="mt"><thead><tr><th>Indicator</th><th>Estimated · in development</th><th>Estimated · operational</th><th>Actual (measured)</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.label} <span class="muted small">(${r.unit})</span></td><td class="num">${val(r.dev)}</td><td class="num">${val(r.op)}</td><td class="${nn(r.act)?'':'nm'}">${nn(r.act)?esc(r.act):'Not measured'}</td></tr>`).join('')}</tbody></table></div>`}
const recTable=rows=>`<div class="tbl"><table class="mt"><thead><tr><th>Indicator</th><th>Recorded on SymbioNet</th><th>Actual (measured)</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.label}</td><td>${nn(r.rec)?esc(r.rec):'–'}</td><td class="nm">Not measured</td></tr>`).join('')}</tbody></table></div>`;
const MLEG=co=>`<p class="note">${co?'<b>Expected</b>: outcomes anticipated by the company in Block 6. ':''}<b>Estimated</b>: calculated from collaboration quantities and company estimates with illustrative methods, shown separately for collaborations in development (mutual interest, feasibility assessment, pilot) and operational exchanges. <b>Actual</b>: values measured by the companies, shown with unit, measurement period and source; actual values are not annualised.</p>`;

function vsmeRows(a){const F=a.flows,has=fn=>F.some(fn);

   ['B3','Total energy consumption',en?'part':'none',en?'Energy flows recorded in Block 1; total consumption by energy source not collected.':'Not collected.'],
   ['B3','Scope 1 and Scope 2 GHG emissions','none','Not collected; avoided-emission estimates are not emissions data.'],

      <label class="selrow">Default sharing level for new resources<select id="st-defLvl">${LEVELS.map((l,i)=>opt(i,l,s.defLvl===i)).join('')}</select></label></div></section>

    ${a.flows.map(f=>`<tr><td>${esc(f.label)}</td><td>${TYPEL[f.type]}</td><td><select data-chg="flvl" data-f="${f.id}" aria-label="Sharing level of ${esc(f.label)}">${LEVELS.map((l,i)=>opt(i,l,f.lvl===i)).join('')}</select></td></tr>`).join('')}</tbody></table></div>

/* ===== Orchestrator: map ===== */
const nodePos=a=>a.settings.sites.find(coordOk)||null;
function mapSVG(ms){
  const W=680,H=400,xr=lon=>(lon-13.20)/0.66*W,yr=lat=>(43.36-lat)/0.25*H,x=lon=>Math.max(10,Math.min(W-10,xr(lon))),y=lat=>Math.max(10,Math.min(H-10,yr(lat)));
  const coast=[[43.40,13.672],[43.35,13.705],[43.31,13.732],[43.255,13.765],[43.20,13.792],[43.16,13.815],[43.08,13.86]];
  const sea=coast.map(([la,lo])=>`${xr(lo).toFixed(1)},${yr(la).toFixed(1)}`).join(' ')+` ${W},${H} ${W},0`,pc={};
  const edges=ms.filter(m=>!['declined','completed','discontinued'].includes(stage(m))&&brandSees(m)).map(m=>{const pa=nodePos(m.A),pb=nodePos(m.B);if(!pa||!pb)return '';const k=[m.A.id,m.B.id].sort().join('-'),i=pc[k]=(pc[k]||0)+1;
    const x1=x(pa.lon),y1=y(pa.lat),x2=x(pb.lon),y2=y(pb.lat),dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,off=(i%2?1:-1)*(18+10*Math.floor((i-1)/2));
    const cx=(x1+x2)/2-dy/len*off,cy=(y1+y2)/2+dx/len*off,g=stage(m),w={proposed:1.2,interest:1.6,mutual:2.2,feas:2.6,pilot:3.2,op:4.2}[g];
    const col=g==='pilot'||g==='op'?'var(--accent)':g==='proposed'?'var(--muted)':'var(--link)';
    return `<path d="M${x1.toFixed(1)},${y1.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}" fill="none" stroke="${col}" stroke-width="${w}" ${g==='proposed'||g==='interest'?'stroke-dasharray="5 4"':''} opacity="${g==='proposed'?.55:.95}"><title>${esc(CATS[m.o.cat].label)} (${STAGEL[g]})</title></path>`}).join('');
  const LB={s1:['l',0],s2:['r',0],s3:['l',-8],s4:['r',12],s5:['l',0],s6:['l',20]};
  const nodes=S.actors.map(a=>{const p=nodePos(a);if(!p)return '';const cx=x(p.lon),cy0=y(p.lat),L=LB[a.id],r=L?L[0]==='r':cx<W*0.55,dy=L?L[1]:0,tx=(cx+(r?14:-14)).toFixed(1),an=r?'start':'end',cy=cy0;
    return `<g><circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${6+a.flows.filter(isOffer).length+a.flows.filter(isNeed).length}" fill="var(--surface)" stroke="var(--fg)" stroke-width="2"/>
    <text x="${tx}" y="${(cy-8+dy).toFixed(1)}" text-anchor="${an}" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600" fill="var(--fg)">${esc(a.short)}</text>
    <text x="${tx}" y="${(cy+8+dy).toFixed(1)}" text-anchor="${an}" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="var(--muted)">${esc(a.town)}</text></g>`}).join('');
  const bp=nodePos(S.bactor),bn=bp?(()=>{const cx=x(bp.lon),cy=y(bp.lat);return `<g><rect x="${(cx-7).toFixed(1)}" y="${(cy-7).toFixed(1)}" width="14" height="14" fill="var(--accent)" stroke="var(--fg)" stroke-width="1.5"/><text x="${(cx+12).toFixed(1)}" y="${(cy-10).toFixed(1)}" text-anchor="start" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="var(--accent)">${esc(ORCH())} (orchestrator)</text></g>`})():'';
  return `<svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of companies, matches and collaborations"><rect width="${W}" height="${H}" fill="var(--surface)"/><polygon points="${sea}" fill="var(--sea)"/>
    <text x="${W-16}" y="${H-16}" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.5" fill="var(--muted)">ADRIATIC SEA</text>${edges}${nodes}${bn}</svg>`}
function mapNote(){const miss=S.actors.filter(a=>!nodePos(a));return `<p class="note">Each company is placed at its first operating site with valid coordinates (illustrative in the demonstration dataset); lines are schematic.${miss.length?` Not shown: ${miss.map(a=>esc(a.short)).join(', ')} (no valid site coordinates).`:''}</p>`}
const MAPLEG=`<div class="legend"><span><svg width="28" height="6"><line x1="0" y1="3" x2="28" y2="3" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="5 4"/></svg>Potential match</span><span><svg width="28" height="6"><line x1="0" y1="3" x2="28" y2="3" stroke="var(--link)" stroke-width="1.6" stroke-dasharray="5 4"/></svg>Interest expressed</span><span><svg width="28" height="6"><line x1="0" y1="3" x2="28" y2="3" stroke="var(--link)" stroke-width="2.6"/></svg>Mutual interest or feasibility</span><span><svg width="28" height="6"><line x1="0" y1="3" x2="28" y2="3" stroke="var(--accent)" stroke-width="3.6"/></svg>Pilot or operational</span></div>`;

/* ===== Orchestrator: Network ===== */
function barrierCounts(){const sh=S.actors.filter(a=>a.settings.barriers);return {sh,c:Object.fromEntries(DIMS.map(d=>[d.k,sh.filter(a=>a.barriers[d.k].sev>=2).length]))}}
const ORDER=[...MSTAGE,'feas','pilot','op','completed','discontinued'];
function renderNetwork(){const ms=allItems(),vis=ms.filter(brandSees),net=impactSum(null),q=queue(),{sh,c}=barrierCounts(),hiddenC=collabMatches().filter(m=>!brandSees(m)).length;
  const heat=`<div class="tbl"><table class="heat"><thead><tr><th>Company</th>${DIMS.map(d=>`<th class="c">${d.label.split(' ')[0]}</th>`).join('')}</tr></thead><tbody>
    ${S.actors.map(a=>`<tr><td>${esc(a.short)}<div class="muted small">${esc(a.sector)}</div></td>${a.settings.barriers?DIMS.map(d=>{const v=a.barriers[d.k].sev;return `<td class="cell c${v}">${SEVL[v]}</td>`}).join(''):'<td colspan="5" class="muted small">Not shared</td>'}</tr>`).join('')}
    <tr><td><b>Medium or High</b></td>${DIMS.map(d=>`<td class="cell num"><b>${c[d.k]} of ${sh.length}</b></td>`).join('')}</tr></tbody></table></div>`;
  const agg={};S.actors.forEach(a=>a.flows.filter(f=>f.lvl===3&&f.ex>0&&f.cat!=='other').forEach(f=>{const r=agg[f.cat]=agg[f.cat]||{off:0,need:0,offN:0,needN:0};if(f.type==='in'){r.need+=f.ex;r.needN++}else{r.off+=f.ex;r.offN++}}));
  const pipe=`<div class="tbl"><table><thead><tr><th>Resource</th><th>Provider</th><th>Receiver</th><th>Distance</th><th>Compatible</th><th>Stage</th></tr></thead><tbody>
    ${vis.filter(m=>stage(m)!=='declined').sort((p,r)=>ORDER.indexOf(stage(r))-ORDER.indexOf(stage(p))).map(m=>{const r=revealed(m);return `<tr><td>${esc(CATS[m.o.cat].label)}</td><td>${r?esc(m.A.short):`<span class="muted">${esc(m.A.sector)}</span>`}</td><td>${r?esc(m.B.short):`<span class="muted">${esc(m.B.sector)}</span>`}</td><td class="num">${fmtKm(m.d,m.dFlag)}</td><td class="num">${isCollab(m)?'–':m.ok+' of 4'}</td><td>${pill(stage(m))}</td></tr>`}).join('')}</tbody></table></div>`;
  return phead('Network',ORCH(),'<span>Network-level view of the Marche footwear and leather supplier network.</span>')+`
  <div class="kpis">
    <div class="kpi"><b>${S.actors.length}</b><span>Participating companies</span></div>
    <div class="kpi"><b>${vis.filter(isPotential).length}</b><span>Potential matches</span></div>
    <div class="kpi"><b>${vis.filter(isDev).length}</b><span>Collaborations in development</span></div>
    <div class="kpi"><b>${vis.filter(isOp).length}</b><span>Operational exchanges</span></div>
    <div class="kpi"><b>${fmt(net.op,1)}</b><span>Estimated avoided emissions, t CO₂e/year (operational; illustrative factors; target ${NETWORK_GOAL})</span></div>
    <button class="kpi act" data-act="view" data-v="facilitate"><b>${qCount(q)}</b><span>Facilitation tasks pending</span></button></div>${discNote()}
  <section class="block">${bhead('','Network map','Matches and collaborations between participating companies, by stage.')}<div class="tbl">${mapSVG(ms)}</div>${MAPLEG}${mapNote()}${hiddenC?`<p class="note">${hiddenC} collaboration${hiddenC>1?'s are':' is'} not shared with the orchestrator and not shown.</p>`:''}</section>
  <div class="grid2">
    <section class="block">${bhead('','Barriers across the network','Barrier severity reported in Block 3 by companies sharing their assessment.')}${heat}</section>
    <section class="block">${bhead('','Shared resources by category','Resources included in aggregated network analysis (quantity · number of resources).')}
      <div class="tbl"><table><thead><tr><th>Category</th><th>Offered</th><th>Sought</th></tr></thead><tbody>${Object.entries(agg).map(([k,r])=>`<tr><td>${esc(CATS[k].label)}</td><td class="num">${r.offN?`${q2s(r.off,CATS[k].unit)} · ${r.offN}`:'–'}</td><td class="num">${r.needN?`${q2s(r.need,CATS[k].unit)} · ${r.needN}`:'–'}</td></tr>`).join('')}</tbody></table></div></section></div>
  <div class="grid2">
    <section class="block">${bhead('','Pipeline','Matches and visible collaborations by stage; identities shown only after mutual consent.')}${pipe}</section>
    <section class="block">${bhead('','Facilitation log')}<ol class="feed">${S.activity.slice(0,8).map(x=>`<li><span class="num">${dfmt(x.ts)}</span><span>${esc(x.text)}</span></li>`).join('')}</ol></section></div>`}

/* ===== Orchestrator: Facilitation ===== */
function renderFacilitate(){const q=queue();
  const sec=(t,l,items,extra)=>`<section class="block">${bhead('',`${t} <span class="badge">${items.length}</span>`,l)}${items.length?`<ul class="queue">${items.join('')}</ul>`:'<div class="empty">No items.</div>'}${extra||''}</section>`;
  return phead('Facilitation',ORCH(),'<span>Facilitation tasks of the orchestrator.</span>')+
  sec('Introductions','Potential matches with at least three compatible indicators and no action from either company.',q.intro.map(m=>`<li><div><b>${esc(CATS[m.o.cat].label)}</b> · ${esc(m.A.sector)} → ${esc(m.B.sector)} · ${m.ok} of 4 indicators compatible · ${fmtKm(m.d,m.dFlag)}</div><form class="qform" data-act-form="intro" data-m="${m.id}"><input aria-label="Note to both companies" value="Several declared conditions appear compatible."><button class="btn primary" type="submit">Introduce</button></form></li>`))+
  sec('Pending responses','Matches awaiting a response for more than seven days.',q.stalled.map(m=>{const s=S.status[m.id],w=s.prov?m.B:m.A;return `<li><div><b>${esc(CATS[m.o.cat].label)}</b> · awaiting a ${esc(w.sector)} for ${days(s.ts)} days</div><button class="btn" data-act="remind" data-m="${m.id}">Send reminder</button></li>`}))+
  sec('Canvas updates','Companies with Canvas blocks not reviewed for six months.',q.refresh.map(([a,n])=>`<li><div><b>${esc(a.short)}</b> · ${n} block${n>1?'s':''} last reviewed ${dfmt(Object.values(a.updated).sort()[0])}</div><button class="btn" data-act="nudge" data-a="${a.id}">Request update</button></li>`))+
  sec('Collaborations requiring support','Collaborations with the orchestrator as active facilitator and open regulatory items, issues or overdue actions.',q.support.map(({m,openReg,issues,late})=>`<li><div><b>${esc(m.A.short)} → ${esc(m.B.short)}</b> · ${esc(CATS[m.o.cat].label)} · ${[openReg?`${openReg} regulatory item${openReg>1?'s':''} to verify`:'',issues?`${issues} issue${issues>1?'s':''}`:'',late?`${late} overdue action${late>1?'s':''}`:''].filter(Boolean).join(' · ')}</div><button class="btn" data-act="bopen" data-open="${m.id}">Open collaboration</button></li>`))+
  sec('Unmatched resources','Offered resources included in aggregated analysis without a compatible need in the network.',q.open.map(([a,f])=>`<li><div><b>${esc(f.label)}</b> · ${q2s(f.ex,f.unit)} · from a ${esc(a.sector)}</div>${S.scout[f.id]?`<span class="pill mutual">External search since ${dfmt(S.scout[f.id])}</span>`:`<button class="btn" data-act="scout" data-f="${f.id}">Start external search</button>`}</li>`),q.hidden?`<p class="note">${q.hidden} further unmatched resource${q.hidden>1?'s are':' is'} not included in aggregated analysis.</p>`:'')}

/* ===== Orchestrator: Initiatives ===== */
function iniForm(i){const v=(k,d='')=>i?i[k]??d:d,locked=i&&i.status!=='proposed';
  return `<form class="block form" id="f-ini"><h2 class="wide">${i?'Edit initiative':'New initiative'}</h2>
    <label class="wide">Initiative name<input id="i-name" required value="${esc(v('name'))}"></label>
    <label>Type<select id="i-type">${INI_TYPES.map(t=>opt(t,t,v('type',INI_TYPES[0])===t)).join('')}</select></label>
    <label>Related barrier dimension<select id="i-dim">${opt('','Network-level need',!v('dim'))}${DIMS.map(d=>opt(d.k,d.label,v('dim')===d.k)).join('')}</select></label>
    <label class="wide">Objective<input id="i-obj" required value="${esc(v('objective'))}"></label>
    <label class="wide">Related barrier or network-level need<input id="i-need" value="${esc(v('need'))}"></label>
    <fieldset class="wide"><legend>FI mechanisms</legend><div class="checkgrid">${Object.keys(MECH).map(k=>`<label class="ck"><input type="checkbox" name="im" value="${k}" ${v('m',[]).includes(k)?'checked':''}><span>${MECH[k]}</span></label>`).join('')}</div></fieldset>
    <fieldset class="wide"><legend>Participating companies${locked?' (fixed after launch)':' (invited on launch)'}</legend><div class="checkgrid">${S.actors.map(a=>`<label class="ck"><input type="checkbox" name="ic" value="${a.id}" ${v('invited',[]).includes(a.id)?'checked':''} ${locked?'disabled':''}><span>${esc(a.short)}</span></label>`).join('')}</div></fieldset>
    <label class="wide">Main activities<input id="i-act" value="${esc(v('activities'))}"></label>
    <label>Coordinator<input id="i-coord" value="${esc(v('coord',ORCH()))}"></label>
    <label>Required resources or budget<input id="i-budget" value="${esc(v('budget'))}"></label>
    <label>Time horizon<input id="i-hor" value="${esc(v('horizon'))}" placeholder="e.g. Jan – Jun 2027"></label>
    <label class="wide">Key milestones (one per line: YYYY-MM-DD, milestone)<textarea id="i-ms" rows="3" placeholder="2027-01-20, Working group kick-off">${esc((v('milestones',[])).map(x=>`${x.d}, ${x.t}`).join('\n'))}</textarea></label>
    ${formBtns('ini',i?'Save':'Create proposal')}</form>`}
function iniCard(i){const comp=i.invited.map(id=>{const a=actor(id),st=i.joined.includes(id)?'in':i.declined.includes(id)?'out':'wait';return `<span class="mem ${st}">${esc(a.short)} · ${i.status==='proposed'?'to invite':st==='in'?'joined':st==='out'?'declined':'invited'}</span>`}).join('')||'<span class="muted small">None selected</span>';

  if(i.status==='ongoing')ctl=CONFIRM&&CONFIRM.ini===i.id?`<span class="small">Confirm completion of this initiative?</span><button class="btn primary" data-act="ini-complete" data-i="${i.id}">Confirm</button><button class="btn quiet" data-act="cancel-confirm">Cancel</button>`:`<button class="btn" data-act="ini-edit" data-i="${i.id}">Edit</button><button class="btn quiet" data-act="ini-askcomplete" data-i="${i.id}">Mark as completed</button>`;
  return `<article class="block"><div class="ihead"><div><div class="label">${esc(i.type)}</div><h2>${esc(i.name)}</h2></div><div class="mact">${ctl}</div></div>
    <dl class="idl"><dt>Objective</dt><dd>${esc(i.objective)}</dd><dt>Related barrier or need</dt><dd>${i.dim?`<span class="dimtag">${dimL(i.dim)}</span> `:''}${esc(i.need)||'–'}</dd>
    <dt>FI mechanisms</dt><dd><div class="chips">${i.m.map(k=>`<span class="mech">${MECHS[k]}</span>`).join('')||'–'}</div></dd><dt>Participating companies</dt><dd><div class="members">${comp}</div></dd>
    <dt>Main activities</dt><dd>${esc(i.activities)||'–'}</dd><dt>Coordinator</dt><dd>${esc(i.coord)||'–'}</dd><dt>Resources or budget</dt><dd>${esc(i.budget)||'–'}</dd><dt>Time horizon</dt><dd>${esc(i.horizon)||'–'}</dd>
    <dt>Key milestones</dt><dd>${i.milestones.length?`<ul class="ms">${i.milestones.map((x,k)=>`<li><label class="ck"><input type="checkbox" data-chg="ms" data-i="${i.id}" data-k="${k}" ${x.done?'checked':''} ${i.status!=='ongoing'?'disabled':''}><span>${dfmt(x.d)} · ${esc(x.t)}</span></label></li>`).join('')}</ul>`:'–'}</dd></dl></article>`}
function renderInitiatives(){const {sh,c}=barrierCounts(),used=new Set(S.initiatives.filter(i=>i.status!=='completed').map(i=>i.dim));
  const sugg=DIMS.filter(d=>c[d.k]>=Math.ceil(sh.length/2)&&!used.has(d.k)).sort((p,r)=>c[r.k]-c[p.k]);
  const grp=(st,t,l)=>{const list=S.initiatives.filter(i=>i.status===st);return `<section class="stack">${bhead('',`${t} <span class="badge">${list.length}</span>`,l)}${list.map(i=>EDIT.ini===i.id?iniForm(i):iniCard(i)).join('')||'<div class="empty">None.</div>'}</section>`};
  return phead('Initiatives',ORCH(),'<span>Network-level programmes addressing barriers or needs shared by several companies.</span>',EDIT.ini==='new'?'':`<button class="btn primary" data-act="ini-new">New initiative</button>`)+`
  <p class="note">Initiatives are coordinated by the orchestrator; individual collaborations are managed by the companies involved and are not listed here.</p>
  ${EDIT.ini==='new'?iniForm(null):''}
  <section class="stack">${bhead('','Suggestions from the barrier analysis','Barrier dimensions rated Medium or High by at least half of the companies sharing their assessment; suggestions are not created automatically.')}
  ${sugg.length?`<ul class="queue">${sugg.map(d=>{const n=NETACT[d.k];return `<li><div><b>${n.t}</b> · ${d.label} barriers · ${c[d.k]} of ${sh.length} companies<div class="small muted">${n.d}</div></div><button class="btn" data-act="ini-suggest" data-d="${d.k}">Create proposal</button></li>`}).join('')}</ul>`:'<div class="empty">No suggestions.</div>'}</section>
  ${grp('proposed','Proposed','Initiatives under preparation; not visible to companies.')}${grp('ongoing','Ongoing','Launched initiatives; invited companies can join from their next steps.')}${grp('completed','Completed','Initiatives formally completed.')}`}

/* ===== Orchestrator: Collaborations, Impact ===== */

  if(k==='bnote'){const b=a.barriers[el.dataset.d],old=b.note||'';b.note=el.value.trim();if(old!==b.note){logChange(a,'Block 3',`${dimL(el.dataset.d)} · comment`,old,b.note||'Removed');touch(a,'b3');save();render()}return}
  if(k==='flvl'){const f=a.flows.find(x=>x.id===el.dataset.f),nv=+el.value;if(nv===f.lvl)return;if(linkedCollabs(a,f).filter(isActiveC).length){PEND={scope:'set',kind:'lvl',id:f.id,lvl:nv};render();return}applyLvl(a,f.id,nv);return}
  if(k.startsWith('site-')){const s=a.settings.sites.find(x=>x.id===el.dataset.s);
    if(k==='site-name'){const o=s.name;s.name=el.value.trim()||o;if(o!==s.name)logChange(a,'Settings','Operating site · name',o,s.name)}
    if(k==='site-addr'){const o=s.addr;s.addr=el.value.trim();if(o!==s.addr){logChange(a,'Settings',`Operating site ${s.name} · address`,o,s.addr);if(s.coord!=='missing'){s.coord='outdated';logChange(a,'Settings',`Operating site ${s.name} · coordinates`,COORDL[s.coord]?'Valid':'','Outdated');toast('Address changed. Enter the coordinates of the new address; distances for this site are unavailable until then.')}}}
    if(k==='site-lat'||k==='site-lon'){const f=k==='site-lat'?'lat':'lon',raw=el.value.trim(),v=raw===''?null:+raw;
      if(v!==null&&(Number.isNaN(v)||Math.abs(v)>(f==='lat'?90:180))){toast('Enter a valid coordinate in decimal degrees.');render();return}
      const o=s[f];s[f]=v;s.coord=nn(s.lat)&&nn(s.lon)?'entered':'missing';logChange(a,'Settings',`Operating site ${s.name} · ${f==='lat'?'latitude':'longitude'}`,nn(o)?String(o):'empty',nn(v)?String(v):'empty')}
    save();render();return}
  const m=findM(el.dataset.m),c=m&&C(m);if(!c)return;
  if(k==='chk'){const it=c[el.dataset.k][+el.dataset.i],old=it.s;it.s=el.value;logCollab(m,`check “${it.t}”`,CHK[old],CHK[it.s])}
  if(k==='cqty')c.qty=Math.max(0,+el.value||0);
  if(k==='qtyType'){const old=c.qtyType;c.qtyType=el.value;logCollab(m,'quantity status',QTYT[old],QTYT[c.qtyType])}
  if(k==='cfreq')c.freq=el.value;
  if(k==='cstart')c.start=el.value;
  if(k==='cnote')c.note=el.value;
  if(k==='meas'||k==='measp'||k==='meass'){const M=c.measured||(c.measured={v:null,period:'',source:''});if(k==='meas')M.v=el.value===''?null:Math.max(0,+el.value);if(k==='measp')M.period=el.value.trim();if(k==='meass')M.source=el.value.trim()}
  if(k==='orch'){const old=c.orch;c.orch=el.value;logCollab(m,'orchestrator involvement',INV[old],INV[c.orch]);if(c.orch!=='active'){c.econ.co=null;c.tasks.forEach(t=>{if(t.o==='brand')t.o='A'})}}
  if(k==='econ')c.econ[el.dataset.f]=el.value===''?null:Math.max(0,+el.value);
  if(k==='task-done'){const t=c.tasks[+el.dataset.i];t.done=el.checked;if(t.done)logCollab(m,'action completed','',t.t)}
  if(k==='task-owner')c.tasks[+el.dataset.i].o=el.value;
  if(k==='econ'&&el.dataset.f==='co'&&isBrand())act(`Co-funding set to €${fmt(c.econ.co||0)} for a collaboration.`);
  save();if(k!=='cnote')render()});
function fromHash(){const h=(location.hash||'').slice(1),ok=(isBrand()?BRAND_TABS:SUP_TABS).some(t=>t[0]===h);if(ok&&h!==S.view){S.view=h;S.open=null;render()}}
window.addEventListener('hashchange',fromHash);
ensureSnaps();save();fromHash();render();
